
name: Docs Powerball AI Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  powerball-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Powerball AI research
        run: python powerball_ai.py

      - name: Save research results
        run: |
          if [ -d data ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Update Powerball AI research results"
              git push
            fi
          fi
